<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work-order assistant</title>
<style>
  :root { --ink:#1d2733; --muted:#5b6672; --line:#d9dee3; --bg:#f6f7f9; --card:#fff; --accent:#0b6e75;
          --alarm:#b3261e; --warn:#8a5a00; --ok:#1e7a3c; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; flex:1; }
  main { display:grid; grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.4fr); gap:16px; padding:16px 20px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 10px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr.asset { cursor:pointer; } tr.asset:hover, tr.asset.sel { background:#eef6f6; }
  .badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:12px; border:1px solid currentColor; }
  .alarm { color:var(--alarm); } .ok { color:var(--ok); } .warn { color:var(--warn); }
  textarea, input { width:100%; font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; }
  button { font:inherit; padding:8px 14px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:#fff; color:var(--accent); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .muted { color:var(--muted); font-size:13px; }
  .issue { padding:6px 8px; border-radius:6px; margin:4px 0; font-size:14px; }
  .issue.blocking { background:#fdecea; color:var(--alarm); } .issue.warning { background:#fff4e0; color:var(--warn); }
  pre { background:#f1f3f5; padding:8px; border-radius:6px; overflow:auto; font-size:12px; max-height:220px; }
  #status { font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>Maintenance work-order assistant</h1>
  <label class="muted" for="key">API key</label>
  <input id="key" style="max-width:220px" placeholder="paste your API key" aria-label="API key" autocomplete="off">
</header>
<main>
  <section aria-labelledby="assets-h">
    <h2 id="assets-h">Assets</h2>
    <table><thead><tr><th>Asset</th><th>Status</th><th>Last reading</th></tr></thead><tbody id="assets"></tbody></table>
    <p class="muted" id="rejected"></p>
  </section>
  <section aria-labelledby="run-h">
    <h2 id="run-h">Work-order draft</h2>
    <p class="muted">Selected asset: <strong id="selected">none</strong></p>
    <label for="req" class="muted">Request</label>
    <textarea id="req" rows="2">Investigate the alarm and draft a work order.</textarea>
    <div class="row"><button id="run" disabled>Draft work order</button></div>
    <p>Status: <span id="status" data-testid="status">idle</span> <span class="muted" id="reason"></span></p>
    <div id="draft"></div>
    <div class="row">
      <button id="approve" disabled>Approve</button>
      <button id="reject" class="secondary" disabled>Reject</button>
    </div>
    <p class="muted" id="usage"></p>
    <details><summary class="muted">Execution history</summary><pre id="events"></pre></details>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let selected = null, run = null;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {"Content-Type": "application/json", "X-API-Key": $("key").value, ...(opts.headers || {})}});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail ? (typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail)) : r.statusText);
  return body;
}

async function loadAssets() {
  const data = await api("/api/assets");
  $("assets").innerHTML = data.assets.map(a => `
    <tr class="asset" data-id="${esc(a.asset_id)}" data-testid="asset-${esc(a.asset_id)}">
      <td><strong>${esc(a.asset_id)}</strong> ${esc(a.name)}<br><span class="muted">${esc(a.site)} · ${esc(a.criticality)}</span></td>
      <td><span class="badge ${a.status === "alarm" ? "alarm" : "ok"}">${a.status === "alarm" ? "alarm: " + esc(a.alarms.join(", ")) : "normal"}</span>
          ${a.stale ? '<br><span class="badge warn">stale data</span>' : ""}
          ${a.rejected_readings ? `<br><span class="badge warn">${a.rejected_readings} reading rejected</span>` : ""}</td>
      <td class="muted">${esc((a.last_reading_at || "").replace("T", " ").replace("+00:00", " UTC"))}</td>
    </tr>`).join("");
  $("rejected").textContent = data.rejected_rows.length ? `${data.rejected_rows.length} source row(s) rejected by validation.` : "";
  document.querySelectorAll("tr.asset").forEach(tr => tr.onclick = () => {
    document.querySelectorAll("tr.asset").forEach(x => x.classList.remove("sel"));
    tr.classList.add("sel"); selected = tr.dataset.id; $("selected").textContent = selected; $("run").disabled = false;
  });
}

function render(r) {
  run = r;
  $("status").textContent = r.status.replace("_", " ");
  $("reason").textContent = r.reason || (r.work_order ? `Created ${r.work_order}` : "");
  const d = r.draft;
  $("draft").innerHTML = !d ? "" : `
    <p><strong data-testid="draft-asset">${esc(d.asset_id)}</strong> <span class="badge ${d.priority === "P1" ? "alarm" : "warn"}" data-testid="priority">${esc(d.priority)}</span> ${esc(d.problem_summary)}</p>
    <table><thead><tr><th>Evidence</th><th>Value</th><th>Time</th></tr></thead><tbody>
      ${d.evidence.map(e => `<tr><td>${esc(e.metric)}</td><td>${esc(e.value)} ${esc(e.unit)}</td><td class="muted">${esc(e.timestamp)}</td></tr>`).join("")}
    </tbody></table>
    <p><strong>Actions</strong></p><ul>${d.recommended_actions.map(a => `<li>${esc(a)}</li>`).join("")}</ul>
    <p><strong>Parts</strong> ${d.parts.length ? d.parts.map(p => esc(p.part_no) + " × " + esc(p.qty)).join(", ") : "none"}</p>
    <p><strong>Safety</strong> ${d.safety.lockout_tagout_required ? "Lockout/tagout required" : "No lockout listed"}: ${esc(d.safety.energy_sources.join(", "))}. ${esc(d.safety.notes)}</p>
    ${d.needs_data_refresh ? '<p class="badge warn">confirm data on site</p>' : ""}
    ${r.issues.map(i => `<div class="issue ${esc(i.severity)}" data-testid="issue">${esc(i.severity)}: ${esc(i.message)}</div>`).join("")}`;
  $("approve").disabled = !r.can_approve;
  $("reject").disabled = r.status !== "awaiting_approval";
  const u = r.usage || {};
  $("usage").textContent = u.calls ? `Model calls ${u.calls} · tokens in ${u.input_tokens} (cached ${u.cache_read_tokens}) · out ${u.output_tokens} · ≈ $${u.cost_usd}` : "";
  $("events").textContent = JSON.stringify(r.events, null, 1);
}

async function act(fn) { try { render(await fn()); } catch (e) { $("status").textContent = "error"; $("reason").textContent = e.message; } }
$("run").onclick = () => act(() => api("/api/runs", {method: "POST", body: JSON.stringify({asset_id: selected, request: $("req").value})}));
$("approve").onclick = () => act(() => api(`/api/runs/${run.run_id}/decision`, {method: "POST", body: JSON.stringify({decision: "approve"})}));
$("reject").onclick = () => act(() => api(`/api/runs/${run.run_id}/decision`, {method: "POST", body: JSON.stringify({decision: "reject", reason: "Rejected in UI"})}));
$("key").onchange = () => loadAssets().catch(e => { $("status").textContent = "error"; $("reason").textContent = e.message; });
if ($("key").value) $("key").onchange();
</script>
</body>
</html>
