# docker compose up --build   ->   http://localhost:8790   (users planner / planner-demo, admin / admin-demo, viewer / viewer-demo)
# Settings (port, Claude key, alert e-mail, simulator, logo): cp .env.example .env, edit, docker compose up -d.
# docker compose down -v starts again from the seed data.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wo
      POSTGRES_PASSWORD: wo-dev
      POSTGRES_DB: wo
    ports:
      - "127.0.0.1:5440:5432"      # for running the tests from the host
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wo"]
      interval: 2s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://wo:wo-dev@db:5432/wo
      EVAL_DATABASE_URL: postgresql://wo:wo-dev@db:5432/wo_eval
      APP_DEMO_USERS: ${APP_DEMO_USERS:-1}
      APP_USERS: ${APP_USERS:-}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      APP_LLM: ${APP_LLM:-auto}
      APP_MODEL: ${APP_MODEL:-claude-haiku-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APP_DEPLOYMENT: ${APP_DEPLOYMENT:-assessment}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:${APP_PORT:-8790}}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3.5:9b}
      LOCAL_LLM_TOKEN: ${LOCAL_LLM_TOKEN:-}
      ALERT_EMAILS: ${ALERT_EMAILS:-}
      ALERT_EMAIL_COOLDOWN_MIN: ${ALERT_EMAIL_COOLDOWN_MIN:-15}
      SMTP_HOST: ${SMTP_HOST:-mailpit}        # empty: the local test inbox below (no login, nothing leaves the machine)
      SMTP_PORT: ${SMTP_PORT:-}
      MAIL_INBOX_URL: ${MAIL_INBOX_URL:-http://localhost:${MAIL_INBOX_PORT:-8025}}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SIM_AUTOSTART: ${SIM_AUTOSTART:-1}
      SIM_RATE: ${SIM_RATE:-6}
      SIM_UNIT: ${SIM_UNIT:-minute}
      APP_BRAND_NAME: ${APP_BRAND_NAME:-Work-order assistant}
      APP_BRAND_SUBTITLE: ${APP_BRAND_SUBTITLE:-Maintenance operations}
      APP_BRAND_LOGO: ${APP_BRAND_LOGO:-}
    volumes:
      - ./branding:/app/branding:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8790}:8790"

  mailpit:
    # Local test inbox: alert e-mail is delivered here unless SMTP_HOST points at a real server.
    # Read it at http://localhost:8025. Nothing is relayed outside this machine.
    image: axllent/mailpit:v1.31.5
    ports:
      - "127.0.0.1:${MAIL_INBOX_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  pgdata:
