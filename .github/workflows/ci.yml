# Three tiers, cheapest first:
#   pull request  -> lint + unit/integration/API/data tests + scripted eval (no tokens, ~3 min)
#   push to main  -> everything above + front-end build + Playwright browser test (pre-deploy gate)
#   nightly       -> live evaluation on Claude Haiku 5.5, 3 trials per case; fails below evals/thresholds.json
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_ADMIN_URL: postgresql://wo:wo-dev@127.0.0.1:5440/wo
  TEST_DATABASE_URL: postgresql://wo:wo-dev@127.0.0.1:5440/wo_test
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: wo, POSTGRES_PASSWORD: wo-dev, POSTGRES_DB: wo}
        ports: ["5440:5432"]
        options: --health-cmd "pg_isready -U wo" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements*.txt}
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check app evals tests
      - run: pytest -q
      - run: python -m evals.run_eval --llm scripted --trials 1
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: eval-scripted, path: reports/eval-scripted.*}

  browser:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: wo, POSTGRES_PASSWORD: wo-dev, POSTGRES_DB: wo}
        ports: ["5440:5432"]
        options: --health-cmd "pg_isready -U wo" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements*.txt}
      - run: pip install -r requirements-dev.txt && playwright install --with-deps chromium
      - run: pytest -q -m browser
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-screenshots, path: reports/*.png}

  live-eval:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: wo, POSTGRES_PASSWORD: wo-dev, POSTGRES_DB: wo}
        ports: ["5440:5432"]
        options: --health-cmd "pg_isready -U wo" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements*.txt}
      - run: pip install -r requirements-dev.txt
      - run: python -m evals.run_eval --llm frontier --trials 3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: eval-live, path: reports/eval-frontier.*}
